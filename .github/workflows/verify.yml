name: Public Evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-public-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject obvious secret material
        run: python3 .github/scripts/check_public_secrets.py

      - name: Verify scanner regression fixtures
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_check_public_secrets.py' -v

      - name: Validate public JSON and SVG
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET

          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text())

          for p in pathlib.Path('assets').glob('*.svg'):
              ET.parse(p)

          print('public evidence syntax ok')
          PY

      - name: Enforce assurance language
        shell: bash
        run: |
          if grep -RInE '\b(ISO certified|NIST certified|OWASP certified|SLSA certified|fully audited)\b' README.md docs claims --exclude=standards-crosswalk.md; then
            echo 'Assurance wording exceeds the allowed public vocabulary.'
            exit 1
          fi
